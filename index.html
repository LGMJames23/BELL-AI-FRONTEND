<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bell-AI</title>
    <script src="main.js" defer></script>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <main id="home-screen">
      <section id="main-section" class="app-container">
        <aside class="sidebar-panel section-card" id="sidebar">
          <h2>SETTINGS, HISTORY, AND INFO</h2>
          <p>Time: XX:XX</p>
          <p>Weather: XX°</p>
        </aside>
        <div class="section-card">
          <header id="top-sctn">
            <h1>BellAI</h1>
          </header>
          <section id="welcome-section" aria-label="Welcome">
            <p id="welcome-text"><strong>Welcome!</strong></p>
            <p>>Bell: Hi I'm Bell, your own AI assistant</p>
          </section>
          <section id="login-sctn" aria-label="Account access">
            <div id="account-question">
              <p id="account-question-heading">>Bell: Do you have an account?</p>
              <button id="login-btn" type="button" aria-controls="login-form">Yes</button>
              <button id="register-btn" type="button" aria-controls="register-form">No</button>
              <form id="account-answer-form"aria-labelledby="account-question-heading" novalidate>
                <label for="account-answer">>Talk to Bell</label>
                <input id="account-answer" name="answer" type="text" aria-describedby="account-answer-feedback" required />
                <button type="submit" class="sbmt">Continue</button>
                <p id="account-answer-feedback" role="alert"></p>
              </form>
            </div>
              <form id="login-form" aria-labelledby="login-heading" hidden novalidate>
              <h2 id="login-heading">>Bell: Welcome back, please Log in</h2>
              <label for="login-username">Username</label>
              <input id="login-username" name="username" type="text" autocomplete="username" aria-describedby="login-feedback" required />
              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" autocomplete="current-password" aria-describedby="login-feedback" required />
              <button type="submit"class=sbmt>Log in</button>
              <button type="button" data-account-back>Back to account question</button>
              <p id="login-feedback" role="alert"></p>
            </form>
            <form id="register-form" aria-labelledby="register-heading" hidden novalidate>
              <h2 id="register-heading">Welcome! Please Register</h2>
              <label for="register-username">Username</label>
              <input id="register-username" name="username" type="text" autocomplete="username" aria-describedby="register-feedback" required />
              <label for="register-password">Password</label>
              <input id="register-password" name="password" type="password" autocomplete="new-password" aria-describedby="register-feedback" required />
              <button type="submit" class="sbmt">Register</button>
              <button type="button" data-account-back>Back to account question</button>
              <p id="register-feedback" role="alert"></p>
            </form>
          </section>
          <div id="user-in-div" class="text-box">
          <h2 id="bell-out">Bell:</h2>
          <label for="user-in">Talk to Bell</label>
          <input id="user-in" type="text" placeholder="Talk to Bell" disabled />
          </div>
         </div>
      </section>
    </main>
  </body>
</html>
